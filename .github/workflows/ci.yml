name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by deploy.yml, so "verified" means precisely what it means here and
  # there is only one place to change it.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    env:
      # Dummy values — enough for `prisma generate`/schema parsing during
      # typecheck/build. No database connection is actually made in CI.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/skolara?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/skolara?schema=public"
      JWT_ACCESS_SECRET: "ci-access-secret"
      JWT_REFRESH_SECRET: "ci-refresh-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @skolara/api exec prisma generate

      - name: Typecheck & build all packages
        run: pnpm turbo run typecheck

      - name: Lint all packages
        run: pnpm turbo run lint

      - name: Run unit tests
        run: pnpm turbo run test

      - name: Validate Prisma schema
        run: pnpm --filter @skolara/api exec prisma validate

      - name: Validate Supabase migrations stay in sync with Prisma migrations
        run: ./scripts/check-migrations.sh

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skolara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/skolara?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/skolara?schema=public"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Required explicitly: pnpm doesn't run dependencies' postinstall hooks
      # by default, so @prisma/client stays an ungenerated stub otherwise, and
      # `migrate deploy` doesn't generate one either. The seed below needs the
      # real client at runtime, not just its types.
      - name: Generate Prisma client
        run: pnpm --filter @skolara/api exec prisma generate

      # Typecheck alone can't catch a hand-written migration with a typo, a
      # wrong column type, or DDL that conflicts with an earlier migration.
      # Applying the whole history to an empty database can.
      - name: Apply every migration from scratch
        run: pnpm --filter @skolara/api exec prisma migrate deploy

      # Deliberately not `prisma migrate diff --exit-code` against the
      # datamodel: the platform-admin email constraint is a partial unique
      # index, which Prisma can't express for PostgreSQL, so an exact-
      # equivalence check would demand dropping a constraint we want. Applying
      # the full history and then seeding through the generated client covers
      # the failure this was meant to catch — a schema and a migration history
      # that disagree — because the seed would fail against a wrong shape.
      - name: Seed through the generated client
        run: pnpm --filter @skolara/api exec prisma db seed

  api-image:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. The image is what actually gets deployed, so a
      # Dockerfile that no longer builds — a moved output path, a dependency
      # that needs a system library — should fail on the pull request that
      # broke it and not on the first attempt to ship. Caching keeps the
      # common case to the final layers.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
